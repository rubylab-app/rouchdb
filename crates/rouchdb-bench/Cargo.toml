[package]
name = "rouchdb-bench"
description = "Criterion benchmarks for RouchDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Only the criterion benches below are benchmarks; keeps `cargo bench -p
# rouchdb-bench -- <criterion args>` from passing them to libtest.
[lib]
bench = false

[dependencies]
rouchdb = { path = "../rouchdb" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
criterion = "0.8"
rouchdb-core = { path = "../rouchdb-core" }

[[bench]]
name = "core_ops"
harness = false

[[bench]]
name = "revtree"
harness = false
