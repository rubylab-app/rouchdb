[package]
name = "rouchdb-cli"
description = "Command-line tool for inspecting and querying RouchDB redb databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "rouchdb"
path = "src/main.rs"

[dependencies]
rouchdb = { path = "../rouchdb" }
rouchdb-core = { path = "../rouchdb-core" }
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0.106"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.1.0"
rouchdb = { path = "../rouchdb" }
# For the CouchDB helpers shared with crates/rouchdb/tests/common.
reqwest = { version = "0.12.17", default-features = false }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0.106"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
