name: Mutation testing

# cargo-mutants on the code a pull request changes: every mutant the tests
# do not catch is a line whose behavior no test checks. Informational
# (continue-on-error), never blocks a merge; the list is in the job summary
# and the mutants.out artifact.
on:
  pull_request:
    paths:
      - "crates/*/src/**.rs"

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants in the diff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff

      # --timeout: seconds per test run, so a mutant that hangs a test
      # (an infinite loop) cannot eat the job.
      - name: Run cargo-mutants on the diff
        run: cargo mutants --in-diff pr.diff --timeout 120 --no-shuffle

      - name: Summary
        if: always()
        run: |
          {
            echo '## Mutants the tests did not catch'
            echo
            if [ -s mutants.out/missed.txt ]; then
              echo '```'
              cat mutants.out/missed.txt
              echo '```'
            else
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
