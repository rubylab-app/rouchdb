[package]
name = "rouchdb-changes"
description = "Changes feed and live streaming for RouchDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
rouchdb-core = { path = "../rouchdb-core", version = "0.5.0" }
rouchdb-query = { path = "../rouchdb-query", version = "0.5.0" }
tokio = { version = "1.37", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7.1"
serde_json = "1.0.106"

[dev-dependencies]
rouchdb-adapter-memory = { path = "../rouchdb-adapter-memory" }
serde_json = "1.0.106"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
async-trait = "0.1.68"
