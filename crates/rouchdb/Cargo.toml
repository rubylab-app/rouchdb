[package]
name = "rouchdb"
description = "Local-first document database with CouchDB replication protocol support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
default = ["rustls-tls"]
# TLS backend for `Database::http` (see rouchdb-adapter-http). With none of
# them enabled, only plain `http://` CouchDB URLs work.
rustls-tls = ["rouchdb-adapter-http/rustls-tls"]
rustls-tls-native-roots = ["rouchdb-adapter-http/rustls-tls-native-roots"]
native-tls = ["rouchdb-adapter-http/native-tls"]
# Keep JSON numbers exactly as written (serde_json's `arbitrary_precision`),
# so integers beyond i64/u64 and decimals beyond f64 round-trip unchanged
# through every adapter and replication. Off by default; see the book's
# "Differences from CouchDB" page.
arbitrary-precision = ["serde_json/arbitrary_precision"]

[dependencies]
async-trait = "0.1.68"
rouchdb-core = { path = "../rouchdb-core", version = "0.4.0" }
rouchdb-adapter-memory = { path = "../rouchdb-adapter-memory", version = "0.4.0" }
rouchdb-adapter-redb = { path = "../rouchdb-adapter-redb", version = "0.4.0" }
rouchdb-adapter-http = { path = "../rouchdb-adapter-http", version = "0.4.0", default-features = false }
rouchdb-changes = { path = "../rouchdb-changes", version = "0.4.0" }
rouchdb-replication = { path = "../rouchdb-replication", version = "0.4.0" }
rouchdb-query = { path = "../rouchdb-query", version = "0.4.0" }
rouchdb-views = { path = "../rouchdb-views", version = "0.4.0" }
serde_json = "1.0.106"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.37", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.106"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12.17", default-features = false }
tempfile = "3.1.0"
base64 = "0.22.1"
async-trait = "0.1.68"
